<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121110">
<title>Dobyvatelé – Cesta k trůnu</title>
<style>
:root{--bg:#121110;--pn:#1a1815;--ln:#2e2a24;--ln2:#463f35;--tx:#ece6d8;--mu:#9b9384;--ac:#c9b68e;--ok:#8fc79a;--no:#d98a80;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{color:var(--tx);font:16px/1.45 var(--sans);background:var(--bg);overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:relative;z-index:1;height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:calc(var(--sat) + 8px) 10px calc(var(--sab) + 10px)}
#start,#game{flex:1;min-height:0;display:flex;flex-direction:column}
/* úvod */
.logo{text-align:center}
.crest{width:52px;height:58px;display:block;margin:0 auto}
h1{margin:18px 0 0;padding-left:.42em;font:400 1.55rem/1.1 var(--serif);letter-spacing:.42em;color:var(--tx)}
h1 small{display:flex;align-items:center;gap:12px;justify-content:center;font:400 .6rem/1 var(--sans);letter-spacing:.38em;margin-top:12px;color:var(--mu)}
h1 small::before,h1 small::after{content:"";height:1px;width:26px;background:var(--ln2)}
#start{position:relative;z-index:2;align-items:center;justify-content:center;padding:6px 0}
.scard{width:100%;max-width:400px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:28px;padding:36px 26px 26px;border:1px solid var(--ln);border-radius:20px;background:var(--pn);box-shadow:0 24px 60px rgba(0,0,0,.55);animation:fade .5s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.rules{display:flex;flex-direction:column;gap:14px}
.preview #game{position:absolute;inset:0;z-index:0;padding:calc(var(--sat) + 6px) 6px calc(var(--sab) + 8px);pointer-events:none;filter:blur(2px) brightness(.4)}
.preview #dock{visibility:hidden}
.rule{display:flex;align-items:center;gap:14px;font-size:.92rem;line-height:1.4;color:#d6cfc0}
.rule:nth-child(1){animation:in .5s .05s both}.rule:nth-child(2){animation:in .5s .15s both}.rule:nth-child(3){animation:in .5s .25s both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.ri{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln2);color:var(--ac)}
.ri svg{width:18px;height:18px}
.acts{display:flex;flex-direction:column;gap:10px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:12px;background:var(--tx);color:var(--bg);border:0;border-radius:12px;font-weight:600;font-size:.95rem;letter-spacing:.04em;transition:opacity .15s,transform .1s}
.big svg{width:20px;height:20px}
.big:active{transform:scale(.985);opacity:.85}
.big:disabled{opacity:.35}
.big.alt{background:transparent;color:var(--tx);border:1px solid var(--ln2)}
.lgb:active{transform:scale(.94)}
/* herní plán */
#mapw{position:relative;flex:1 1 0;min-height:0;margin:0 2px;border:1px solid var(--ln);border-radius:16px;overflow:hidden;background:var(--pn)}
#lgb{position:absolute;top:10px;left:10px;z-index:2;width:34px;height:34px;flex:none;padding:0;border-radius:50%;font:400 .95rem var(--serif);background:rgba(18,17,16,.82);border:1px solid var(--ln2)}
/* panel: kdo hraje + kostka */
#turn{display:flex;align-items:center;gap:14px;padding:12px 14px;border:2px solid var(--ac);border-radius:18px;background:linear-gradient(180deg,#403930,#2d2821);box-shadow:0 -8px 24px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.16);animation:tin .35s ease-out}
.die3.ready{box-shadow:0 0 0 3px rgba(236,230,216,.35)}
@keyframes rdy{50%{box-shadow:0 0 0 7px rgba(236,230,216,.12);transform:translateY(-2px)}}
@keyframes tin{from{opacity:.4;transform:translateY(6px)}}
.av{flex:0 0 16px;height:16px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 2px #f4efe3}
.tt{flex:1;min-width:0;line-height:1.25}
.tt b{display:block;font-size:1.05rem;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{display:block;margin-top:2px;font-size:.8rem;color:#cfc6b4}
.st{width:13px!important;height:13px!important;flex:none;vertical-align:-2px;margin-left:5px;color:var(--mu)}
.die3{flex:0 0 62px;width:62px;height:62px;position:relative;border-radius:14px;perspective:900px}
.die3.ready{cursor:pointer;animation:rdy 1.2s ease-in-out infinite}
.cube3{width:100%;height:100%;position:relative;transform-style:preserve-3d}
#turn .cube3 .die{position:absolute;inset:0;width:auto;height:auto;flex:none;padding:9px;border-radius:14px;backface-visibility:hidden}
.cube3 .f1{transform:translateZ(31px)}.cube3 .f6{transform:rotateY(180deg) translateZ(31px)}
.cube3 .f2{transform:rotateY(90deg) translateZ(31px)}.cube3 .f5{transform:rotateY(-90deg) translateZ(31px)}
.cube3 .f3{transform:rotateX(90deg) translateZ(31px)}.cube3 .f4{transform:rotateX(-90deg) translateZ(31px)}
.die3.roll{animation:hop 1.5s ease-out}
.die3.landed{animation:land .9s ease-out}
@keyframes land{0%{box-shadow:0 0 0 0 rgba(236,230,216,.7)}100%{box-shadow:0 0 0 16px rgba(236,230,216,0)}}
@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-22px) scale(1.04)}62%{transform:translateY(0) scale(1)}78%{transform:translateY(-7px)}100%{transform:translateY(0)}}
#map{display:block;width:100%;height:100%}
#map text{pointer-events:none}
.tk{transform:translate(0,0)}
#toks.go .tk{transition:transform .26s ease-in-out}
.tk .ring{display:none}
.tk.act .ring{display:inline}
.tk.act .bn{animation:bhop .7s ease-in-out infinite;transform:scale(1.3)}
.tk.act .ring{animation:pr 1s ease-in-out infinite;transform-origin:0 6px}
@keyframes bhop{50%{transform:translateY(-6px) scale(1.3)}}
@keyframes pr{50%{transform:scale(1.2);opacity:.5}}
.spin{transform-box:fill-box;transform-origin:center;animation:spn 3.5s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.tpl{fill:none;stroke:#6d4fd6;stroke-width:2.4;stroke-dasharray:3 7;stroke-linecap:round;opacity:.8;animation:dsh 1.1s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-18}}
.tpr{fill:none;stroke:#6d4fd6;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:tpp 1.8s ease-in-out infinite}
@keyframes tpp{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.14);opacity:.25}}
.bon .bi .li{width:52px;height:52px}
#tip b .li{width:16px;height:16px;flex:none;vertical-align:-3px;margin-right:4px}
.cellpop{animation:cp .6s ease-out}
@keyframes cp{0%{opacity:0;transform:scale(.5)}}
.dec{filter:saturate(.4);opacity:.55}
/* bublina s nápovědou k políčku */
#tip{position:absolute;z-index:3;width:max-content;max-width:min(240px,86%);padding:9px 13px 10px;border:1px solid var(--ln2);border-radius:10px;background:var(--pn);color:var(--tx);font-size:.82rem;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;animation:tipin .18s ease-out}
#tip b{display:block;color:var(--ac);font-size:.88rem;font-weight:600;margin-bottom:3px}
#tip::after{content:"";position:absolute;left:var(--ax,50%);width:9px;height:9px;margin-left:-4.5px;background:var(--pn);border:solid var(--ln2);border-width:0 1px 1px 0;transform:rotate(45deg);bottom:-5px}
#tip.dn::after{bottom:auto;top:-5px;border-width:1px 0 0 1px}
@keyframes tipin{from{opacity:0;scale:.94}}
/* živé prostředí */
.cl{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(500px)}}
.flg{transform-box:fill-box;transform-origin:0 50%;animation:wave 1.1s ease-in-out infinite alternate}
@keyframes wave{from{transform:skewY(-9deg) scaleX(1)}to{transform:skewY(9deg) scaleX(.8)}}
.bnk{transform-box:fill-box;transform-origin:center;animation:bnk 4.2s infinite}
@keyframes bnk{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 5s ease-in-out infinite}
@keyframes ear{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(-12deg)}92%{transform:rotate(7deg)}}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
/* bomba: ohořelá figurka + výbuch */
.tk .char{opacity:0;transition:opacity .45s}
.tk.bomb .char{opacity:1}
.tk .smoke{opacity:0}
.tk.bomb .smoke{animation:smk 1.9s ease-out infinite}
.tk.bomb .smoke:nth-child(2){animation-delay:.6s}.tk.bomb .smoke:nth-child(3){animation-delay:1.2s}
.smoke{transform-box:fill-box;transform-origin:center}
@keyframes smk{0%{opacity:.75;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(5px,-22px) scale(1.6)}}
.boom{pointer-events:none}
.boom .b1{transform-box:fill-box;transform-origin:center;animation:bm .7s ease-out forwards}
@keyframes bm{0%{transform:scale(.2);opacity:1}100%{transform:scale(2.4);opacity:0}}
/* spodní panel */
#game{position:relative}
#dock{flex:none;padding:10px 2px 2px}
.playing #app{padding:calc(var(--sat) + 6px) 6px calc(var(--sab) + 8px)}
.die{flex:0 0 58px;width:58px;height:58px;border-radius:12px;background:#ece6d8;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.pp{width:9px;height:9px;margin:auto;border-radius:50%}
.pp.on{background:#1a1814}
/* okno s otázkou */
#qm,#lg{position:fixed;inset:0;background:rgba(8,7,6,.7);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#lg{z-index:11}
.card{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--pn);border:1px solid var(--ln);border-bottom:0;border-radius:20px 20px 0 0;padding:22px 18px calc(var(--sab) + 14px);box-shadow:0 -20px 60px rgba(0,0,0,.5);line-height:1.5;animation:up .25s ease-out;position:relative}
#qm{align-items:center;padding:14px 12px}
#qm .card{border:1px solid var(--ln);border-radius:20px;padding:24px 18px 16px;box-shadow:0 24px 70px rgba(0,0,0,.65);animation:qin .22s ease-out}
#qm .card::before{display:none}
@keyframes qin{from{opacity:0;transform:scale(.97)}}
#res{min-height:7.5em}
#qm .bd{scrollbar-width:none;-ms-overflow-style:none;overflow-x:hidden}
#qm .bd::-webkit-scrollbar{display:none}
#ft{display:grid}#ft>*{grid-area:1/1}
.card::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:3px;margin-left:-18px;border-radius:2px;background:var(--ln2)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.bd{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding-top:6px}
.ft{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.ft:empty{display:none}
.hd{color:var(--tx);font-weight:600;margin-bottom:8px}
.hd .li{width:18px;height:18px;vertical-align:-4px;margin-right:6px}
.qt{margin:4px 0 8px;font:400 1.1rem/1.5 var(--serif)}
.qt b{font-weight:400}
.ex{margin-top:10px;color:var(--mu);font-size:.92rem}
.rs{margin-top:14px}
.rs-ok{color:var(--ok)}.rs-no{color:var(--no)}
.o{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;margin:8px 0;padding:10px 14px 10px 10px;background:transparent;color:var(--tx);border:1px solid var(--ln2);border-radius:12px;text-align:left;font-size:.97rem;transition:.15s}
.o i{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8rem;font-weight:600;color:var(--mu);border:1px solid var(--ln2)}
.o:not(:disabled):active{transform:scale(.99);border-color:var(--tx)}
.o.sel{border-color:var(--ac);background:rgba(201,182,142,.08)}
.o.sel i{color:var(--ac);border-color:var(--ac)}
.o.ok{background:rgba(143,199,154,.12);border-color:var(--ok)}
.o.bad{background:rgba(217,138,128,.12);border-color:var(--no)}
.o.ok i{background:var(--ok);color:var(--bg);border-color:var(--ok)}.o.bad i{background:var(--no);color:var(--bg);border-color:var(--no)}
.rw{padding:12px 14px;border:1px solid var(--ln2);border-left-width:4px;border-radius:10px;background:var(--bg);margin:8px 0}
.bon{text-align:center;padding:16px 0 6px}
.bon .bi{line-height:1;animation:pop .45s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.bon h2{margin:16px 0 6px;font:400 1.35rem var(--serif);letter-spacing:.06em;color:var(--tx)}
.bon p{margin:4px 0;font-size:.98rem;color:var(--mu)}
.dh{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);margin-bottom:12px;font-size:.9rem;color:var(--mu)}
.dh b{color:var(--tx)}
.dh .die{flex:0 0 38px;width:38px;height:38px;padding:6px;border-radius:9px;box-shadow:none}
.dh .pp{width:6px;height:6px}
/* legenda */
.lr{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--ln);font-size:.92rem;color:#d6cfc0}
.lr:last-child{border:0}
.li{width:26px;height:26px;flex:0 0 26px;color:var(--ac)}
.le{flex:0 0 26px;display:grid;place-items:center}
.lg2{color:var(--mu);font-size:.68rem;letter-spacing:.2em;margin:16px 0 2px}
@media (max-height:640px){.crest{width:44px;height:49px}h1{font-size:1.35rem;margin-top:12px}.scard{gap:18px;padding:24px 22px 20px}.o{min-height:48px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== žetony na herním plánu ===== */
.tl{transition:transform .18s ease-out}
@media(hover:hover){.tl:hover{transform:scale(1.05)}}
.tl .dim,.tl .tint{opacity:0;pointer-events:none}
.tl .dim{transition:opacity .5s}
.tl.done .dim{opacity:.5}
.tl.off .dim{opacity:.5}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:4;max-width:calc(100% - 100px);padding:8px 14px;border:1px solid #6d4fd6;border-radius:999px;background:var(--pn);color:var(--tx);font-size:.84rem;font-weight:600;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;animation:tipin .25s ease-out}
.tl .halo{fill:none;opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center;transition:opacity .25s}
.tl.act .halo{stroke:#14100a;opacity:1;animation:tlGlow 1.8s ease-in-out infinite}
.tl.has .halo{stroke:var(--pc);opacity:1;animation:none}
.tl.sel .halo{stroke:#14100a;opacity:1}
.tl.fx-ok .halo{stroke:var(--ok);animation:tlRing 1.3s ease-out}
.tl.fx-bad .halo{stroke:var(--no);animation:tlRing 1.1s ease-out}
.tl.fx-ok .tint{fill:var(--ok);--to:.35;animation:tlTint 1.3s ease-out}
.tl.fx-bad .tint{fill:var(--no);--to:.3;animation:tlTint 1.1s ease-out}
.tl.fx-sel{animation:tlSel .38s ease-out}
.tl.fx-flip{animation:tlFlip .5s ease-in-out}
@keyframes tlGlow{50%{opacity:.4}}
@keyframes tlRing{0%{opacity:0;transform:scale(.95)}25%{opacity:1}100%{opacity:0;transform:scale(1.22)}}
@keyframes tlTint{0%{opacity:0}30%{opacity:var(--to)}100%{opacity:0}}
@keyframes tlSel{0%{transform:scale(1)}30%{transform:scale(1.12)}60%{transform:scale(.94)}100%{transform:scale(1)}}
@keyframes tlFlip{0%{transform:scale(1,1)}50%{transform:scale(.05,1.06)}100%{transform:scale(1,1)}}
.tb1{transform-box:fill-box;transform-origin:center;animation:tBurst .7s ease-out forwards}
.tbs{animation:tSpark .7s ease-out forwards}
@keyframes tBurst{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes tSpark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@media(prefers-reduced-motion:reduce){.tl,.tl *,.tburst *{animation:none!important;transition:none!important}}

const Q=[
{q:`Politologie je věda především o:`,o:["Duševních procesech jednotlivce","Výchově a vzdělávání","Životě skupin a chování lidí ve společnosti","Politice, politické moci a státních institucích"],c:3,e:"Politologie zkoumá politickou moc, stát, instituce a mezinárodní vztahy – nikoli psychologii jednotlivce, pedagogiku ani obecné chování skupin (sociologii)."},
{q:`Co znamená, když v Poslanecké sněmovně vznikne koalice politických stran?`,o:["Strany spojí síly a společně sestaví vládu / hlasují spolu","Strana odejde z parlamentu a ukončí svou činnost","Prezident rozpustí sněmovnu a vyhlásí nové volby","Jedna strana získá absolutní většinu a vládne úplně sama"],c:0,e:"Koalice je spojení dvou nebo více stran, které společně vytvoří vládu, protože žádná z nich sama nemá dost hlasů."},
{q:`Která ideologie klade důraz na svobodu jednotlivce a odpovědnost každého sám za sebe?`,o:["Socialismus","Liberalismus","Konzervatismus","Komunismus"],c:1,e:"Liberalismus staví na osobní svobodě, individuální odpovědnosti a omezené roli státu v životě jednotlivce."},
{q:`Jaký je hlavní cíl liberalismu?`,o:["Zajištění společenské rovnosti","Ochrana tradice a stability","Svoboda jednotlivce a volný trh","Posílení národní identity"],c:2,e:"Liberalismus staví na osobní svobodě a minimalizaci zásahů státu do ekonomiky i soukromého života."},
{q:`Jaký je hlavní cíl socialismu?`,o:["Zajištění spravedlivého rozdělení bohatství","Posílení náboženských a rodinných hodnot","Maximální svoboda podnikání","Mezinárodní bezpečnost"],c:0,e:"Socialismus usiluje o větší rovnost a spravedlivější rozdělení majetku ve společnosti."},
{q:`Jaký je hlavní cíl konzervatismu?`,o:["Vytvoření rovnostářské společnosti","Zajištění absolutní svobody jednotlivce","Udržení tradic a pomalé, opatrné změny","Zrušení role státu v ekonomice"],c:2,e:"Konzervatismus preferuje stabilitu, tradici a obezřetné, postupné změny."},
{q:`Urči ideologii podle popisu: Stát je hlavním zaměstnavatelem a vlastníkem výroby, poskytuje bezplatné obědy, potravinové příděly a usiluje o vyrovnané platy i důchody pro všechny.`,o:["Socialismus","Liberalismus","Konzervatismus","Anarchismus"],c:0,e:"Silná role státu v ekonomice a snaha o rovnost výsledků jsou typickým znakem socialismu."},
{q:`BONUS! Urči ideologii podle popisu: Stát je vnímán jako zbytečný a škodlivý, společnost by měla fungovat na dobrovolné spolupráci lidí bez vlády, armády a policie. Tuto myšlenku často zastává i punková subkultura.`,o:["Komunismus","Feminismus","Nacionalismus","Anarchismus"],c:3,e:"Jde o anarchismus – extrémní směr, který zcela odmítá stát a jeho instituce a klade důraz na maximální svobodu jednotlivce i komunit."},
{q:`Program „Budeme podporovat malé podnikatele, ulevíme jim slevou na dani a občanům umožníme manželství bez rozdílu orientace” odpovídá:`,o:["Levicová autoritativní strana","Pravicová autoritativní strana","Levicová liberální strana","Pravicová liberální strana"],c:3,e:"Podpora podnikatelů a nižší daně jsou pravicové prvky, manželství pro všechny je liberální (libertariánský) prvek – jde tedy o pravicovou liberální stranu."},
{q:`Program „Budeme podporovat chudé občany, zvýšíme sociální dávky a zakážeme hazard a sázení” odpovídá:`,o:["Levicová autoritativní strana","Pravicová autoritativní strana","Levicová liberální strana","Pravicová liberální strana"],c:0,e:"Podpora chudých a vyšší sociální dávky jsou levicové prvky, zákaz hazardu a sázení (stát lidem něco zakazuje) je autoritativní prvek – jde tedy o levicovou autoritativní stranu."},
{q:`Pokud strana prosazuje zákon „Omezíme migraci a přijmeme jen ty, kdo se přizpůsobí našim hodnotám”, nejblíže má k ideologii:`,o:["Socialismus","Liberalismus","Konzervatismus","Komunismus"],c:2,e:"Důraz na ochranu tradičních hodnot a obezřetnost vůči změnám (včetně migrace) je typický pro konzervatismus."},
{q:`Urči, které DVĚ ideologie chtějí změnit tento paradox: majitel firmy jezdí v luxusním autě, zatímco jeho zaměstnanec, který pro něj tvrdě pracuje, si takové auto nikdy nekoupí – a ještě slyší, že když bude dost dřít, možná jednou ano.`,o:["Socialismus","Liberalismus","Konzervatismus","Komunismus"],c:[0,3],e:"Socialismus i komunismus kritizují nerovnost mezi vlastníky výrobních prostředků a zaměstnanci a usilují o spravedlivější rozdělení bohatství."},
{q:`Co jsou masmédia?`,o:["Komunikační prostředky zaměřené na osobní výměnu informací mezi jednotlivci, například telefonáty","Prostředky veřejné komunikace, které oslovují široké publikum","Nástroje určené výhradně pro vzdělávání, například školní informační systémy a učební materiály","Systémy sloužící k fyzickému přenosu zpráv a zásilek, například poštovní a logistické služby"],c:1,e:"Masmédia jsou určena širokému publiku – na rozdíl od osobní komunikace (telefon, dopis) oslovují tisíce až miliony lidí najednou."},
{q:`Jaký je hlavní cíl manipulativní reklamy?`,o:["Informovat objektivně o vlastnostech produktu","Ovlivnit chování spotřebitele emočními apely","Ukázat nevýhody konkurence pravdivě","Vzdělávat veřejnost"],c:1,e:"Manipulativní reklama využívá emoce (strach, touhu, humor), aby přiměla spotřebitele ke koupi – ne aby ho informovala."},
{q:`Co je typickým znakem bulvárního média?`,o:["Důraz na ověřené zdroje a věcnost","Šokující titulky, senzace a skandály","Odborné analýzy a statistiky","Dlouhé vědecké komentáře"],c:1,e:"Bulvár staví na emocích a senzaci – cílem je upoutat pozornost, ne informovat vyváženě."},
{q:`Co je clickbait?`,o:["Odborný článek s citacemi zdrojů","Titulek nebo náhled, který slibem senzace láká ke kliknutí, ale obsah slib nesplní","Placená reklama označená jako reklama","Bezpečnostní program proti virům"],c:1,e:"Clickbait (návnada na kliknutí) využívá zveličený, záhadný nebo šokující titulek, aby získal co nejvíc prokliků. Samotný obsah pak bývá nudný nebo zavádějící."},
{q:`Co jsou dezinformace?`,o:["Informace, které jsou zastaralé, protože se situace změnila","Záměrně šířené nepravdivé nebo zkreslené informace, které mají ovlivnit lidi nebo uškodit","Zprávy, které nejsou zajímavé pro širokou veřejnost","Názory novináře uvedené v komentáři"],c:1,e:"Podstatou dezinformace je úmysl: její tvůrce ví, že lže nebo zkresluje, a chce tím někoho ovlivnit, poškodit nebo vydělat."},
{q:`Co je nejlepší udělat dřív, než sdílíš šokující zprávu na sociální síti?`,o:["Sdílet ji hned, aby se o ní dozvědělo co nejvíc lidí","Ověřit zdroj","Zkontrolovat, kolik má zpráva lajků","Smazat ji, protože šokující zprávy jsou vždy lživé"],c:1,e:"Šokující obsah se šíří rychle právě proto, že vyvolává emoce. Než ho sdílíš, ověř původní zdroj a hledej potvrzení u dalších nezávislých zdrojů."},
{q:`Co je filtrační bublina na sociálních sítích?`,o:["Funkce, která maže nevhodné příspěvky","Stav, kdy nám algoritmy ukazují hlavně obsah odpovídající našim zájmům a názorům, takže vidíme jednostranný pohled","Ochranný program proti hackerům","Skupina lidí, kteří se navzájem neznají"],c:1,e:"Algoritmy vybírají příspěvky podle toho, co nás zaujalo dřív. Tím se můžeme ocitnout v bublině, kde nepotkáme jiné názory, a svět nám připadá jednodušší, než je."},
{q:`Co je product placement?`,o:["Prodej produktů v kamenném obchodě","Umístění produktu do filmu","Snížení ceny produktu při akci","Test produktu nezávislou organizací"],c:1,e:"Značka zaplatí za to, aby se její produkt objevil v ději filmu, seriálu nebo videa. Divák ho vnímá jako přirozenou součást příběhu, a ne jako reklamu."},
{q:`Které z uvedených médií je v České republice veřejnoprávní?`,o:["TV Nova","TV Prima","Česká televize","Blesk"],c:2,e:"Veřejnoprávní média, tedy Česká televize a Český rozhlas, financují především občané z poplatků. Mají sloužit veřejnosti a nemají být řízena politiky ani majiteli."},
{q:`Proč se médiím někdy říká čtvrtá moc?`,o:["Protože mají nejvíc peněz ze všech institucí","Protože ovlivňují celý svět","Protože jsou čtvrtou složkou státní moci s právem vydávat zákony","Protože vysílají čtyři programy"],c:1,e:"Moc zákonodárná, výkonná a soudní je doplněna nezávislými médii. Ta sledují politiky a úřady a upozorňují na chyby a zneužití moci. Nejde o oficiální státní moc, ale o kontrolní roli."},
{q:`Co je deepfake?`,o:["Hluboké zamyšlení nad zprávou","Nahrazení obličeje ve videu","Zpráva, která se objevila na tmavém webu","Reklama zobrazená uživateli opakovaně"],c:1,e:"Deepfake dokáže přesvědčivě podvrhnout tvář i hlas. Lze ho zneužít k dezinformacím, podvodům nebo poškození pověsti, proto je potřeba si ověřovat i videa."},
{q:`Který znak nejvíc nasvědčuje spolehlivosti zpravodajského článku?`,o:["Je v něm uveden autor, zdroje informací a lze je ověřit","Má velmi dlouhý titulek psaný velkými písmeny","Obsahuje hodně vykřičníků a emotivních slov","Zdroj je pouze „anonymní odborník“"],c:0,e:"Důvěryhodný článek je transparentní: uvádí autora, na koho se odvolává a kde jsou dohledatelná data. Senzační jazyk a anonymní zdroje jsou varováním."},
{q:`Jak se nazývá víra v jednoho Boha?`,o:["Ateismus","Polyteismus","Monoteismus","Dualismus"],c:2,e:"Monoteismus označuje víru v jednoho Boha. Polyteismus je víra ve více bohů, ateismus popírá existenci Boha a dualismus uznává dvě protikladné síly."},
{q:`Které náboženství vyžaduje půst během měsíce ramadánu?`,o:["Hinduismus","Islám","Buddhismus","Judaismus"],c:1,e:"Ramadán je devátý měsíc islámského lunárního kalendáře, během něhož muslimové drží půst od úsvitu do soumraku jako jeden z pěti pilířů islámu."},
{q:`Jak se nazývá svatá kniha muslimů?`,o:["Bible","Korán","Tóra","Védy"],c:1,e:"Korán je posvátná kniha islámu. Muslimové věří, že byl zjeven proroku Mohamedovi."},
{q:`Višnu a Šiva patří mezi nejvýznamnější bohy. Z jakého náboženství pocházejí?`,o:["Hinduismus","Islám","Buddhismus","Judaismus"],c:0,e:"Višnu a Šiva jsou nejdůležitější bohové hinduismu. Višnu je ochránce světa, Šiva bůh ničení a znovuzrození."},
{q:`Kdo je zakladatelem buddhismu?`,o:["Mohamed","Buddha","Mojžíš","Konfucius"],c:1,e:"Buddhismus založil v Indii princ Siddhártha Gautama, později nazvaný Buddha, tedy probuzený. Učil cestu k osvobození od utrpení."},
{q:`Jak se nazývá nejposvátnější část židovských písem, která obsahuje pět knih Mojžíšových?`,o:["Korán","Védy","Tóra","Nový zákon"],c:2,e:"Tóra je základem judaismu. Tvoří ji prvních pět knih Starého zákona a je psána na svitcích uložených v synagogách."},
{q:`Které svátky slaví křesťané na památku Ježíšova zmrtvýchvstání?`,o:["Vánoce","Velikonoce","Letnice","Hromnice"],c:1,e:"Velikonoce jsou nejvýznamnějším křesťanským svátkem. Křesťané si o nich připomínají ukřižování a vzkříšení Ježíše Krista."},
{q:`Co nejlépe charakterizuje destruktivní sektu?`,o:["Otevřená diskuse a svobodný odchod členů","Autoritářský vůdce, manipulace, izolace členů od okolí a tvrdá kontrola","Veřejně dostupné hospodaření","Podpora členů v kontaktu s rodinou a přáteli"],c:1,e:"Pro destruktivní sekty je typický absolutní vůdce, psychická manipulace, odtržení od rodiny a přátel a obtížný odchod. Právě tím se liší od běžných církví."},
{q:`Která technika se často používá při získávání nových členů do sekt?`,o:["Důsledné vysvětlení všech pravidel a závazků na začátku","Zahrnutí člověka velkou láskou a přátelstvím","Zveřejnění všech financí organizace","Právní poradenství před vstupem"],c:1,e:"Člověk, který je osamělý nebo má problémy, dostane najednou spoustu pozornosti a vřelosti. Vzniká tak pouto, které se později zneužije k manipulaci."},
{q:`Urči náboženskou skupinu na základě popisu: Tato skupina byla založena L. Ronem Hubbardem, používá techniku zvanou 'auditing' a jejím cílem je dosáhnout stavu 'Clear'. Pokud někdo v této náboženské skupině selže, čeká ho tvrdý rehabilitační program.`,o:["Satanismus","Vesmírní lidé","Scientologie","Svědkové Jehovovi"],c:2,e:"Scientologie byla založena L. Ronem Hubbardem v roce 1954. Auditing je technika rozhovorů, jejímž cílem je dosáhnout stavu 'Clear' – odstranění negativních vzpomínek."},
{q:`Na Svinově vidíš dva lidi stojící u stánku s časopisy Strážná věž a Probuďte se! Urči, o jakou náboženskou skupinu se jedná.`,o:["Satanismus","Vesmírní lidé","Scientologie","Svědkové Jehovovi"],c:3,e:"Svědkové Jehovovi jsou známí svou misionářskou činností – pravidelně chodí dům od domu a nabízejí náboženské publikace (Strážná věž, Probuďte se!)."},
{q:`Kdo je hlavou římskokatolické církve?`,o:["Dalajláma","Patriarcha","Papež","Imám"],c:2,e:"Papež sídlí ve Vatikánu a je nejvyšším představitelem římskokatolické církve. Dalajláma je buddhista a imám vede modlitby v islámu."},
{q:"Souhrn právních norem jako obecně závazných pravidel chování, stanovených nebo uznaných státem a v případě potřeby vynutitelných státní mocí, je:",o:["Subjektivní právo","Objektivní právo"],c:1,e:"Objektivní právo (právo v normativním smyslu) = systém obecně závazných pravidel vydávaných či uznaných státem, platných pro všechny a vynutitelných státní mocí."},
{q:"Možnost určitého chování, kterou zaručuje právní řád a které odpovídá povinnost chovat se podle práva, je:",o:["Subjektivní právo","Objektivní právo"],c:0,e:"Subjektivní právo = možnost chování zaručená subjektu objektivním právem; zahrnuje i odpovídající povinnost chovat se dle práva (pod hrozbou sankce)."},
{q:"Mirek si koupil automobil, uplatňuje vlastnické právo. Jde o:",o:["Subjektivní právo","Objektivní právo"],c:0,e:"Konkrétní osoba (Mirek) uplatňuje své oprávnění, tedy subjektivní právo."},
{q:"Který příklad je objektivní právo?",o:["Mohu jít vyjadřovat své názory na náměstí.","Povinná školní docházka v ČR.","Koupil jsem byt 2kk, uplatňuji vlastnické právo.","Včera jsem si vzal svého partnera."],c:1,e:"Obecně závazné pravidlo platné pro všechny (právní norma) = objektivní právo. Ostatní možnosti jsou uplatnění práv konkrétním člověkem (subjektivní právo)."},
{q:"Který příklad je subjektivní právo?",o:["Soubor norem vydaných a uznaných státem.","V ČR je možné vlastnit majetek.","Tereza včera slavila 18 let, může si dát víno.","Alkohol mohou v ČR konzumovat všichni 18+."],c:2,e:"Subjektivní právo = možnost chování konkrétního subjektu (Terezy), kterou jí zaručuje objektivní právo."},
{q:"Co je povinnost občana ČR?",o:["Svoboda projevu","Povinná školní docházka","Právo na ochranu zdraví","Právo vlastnit majetek"],c:1,e:"Ostatní možnosti jsou práva."},

  if(n!=1&&n!=FIN&&(b||isTp))bd=`<circle cx="${x+13.5}" cy="${y+13.5}" r="6.6" fill="#fffdf6" stroke="#2b2216" stroke-width="1.2"/><text x="${x+13.5}" y="${y+16.2}" text-anchor="middle" font-size="7.6" font-weight="700" fill="#2b2216" style="font-family:var(--sans)">${n}</text>`;
  h+=tile(n,x,y,k,ic,((b||isTp)?" sp":"")+(isTp&&!tOn?" off":""),ex,bd);
 }
 $("cells").innerHTML=h;tileStates();
}
const OF={1:[[0,0]],2:[[-9,0],[9,0]],3:[[-10,4],[10,4],[0,-8]],4:[[-9,-8],[9,-8],[-9,9],[9,9]]};

/* 3D figurka (pěšák) s barevným přechodem a odleskem */
const CH=`<g class="char"><ellipse cx="0" cy="-1" rx="12.5" ry="5" fill="#1b1612" stroke="#000" stroke-width="1"/><path d="M-8.5 -2Q-8 -6 -4.5 -8Q-2.8 -16 -3.6 -20L3.6 -20Q2.8 -16 4.5 -8Q8 -6 8.5 -2Q0 2 -8.5 -2Z" fill="#1b1612" stroke="#000" stroke-width="1" stroke-linejoin="round"/><ellipse cx="0" cy="-20" rx="7.2" ry="2.6" fill="#1b1612" stroke="#000" stroke-width="1"/><circle cx="0" cy="-27" r="8.2" fill="#2a231c" stroke="#000" stroke-width="1"/><ellipse cx="-3" cy="-30.5" rx="2.6" ry="1.7" fill="rgba(255,255,255,.2)" transform="rotate(-30 -3 -30.5)"/></g><g><circle class="smoke" cx="-2" cy="-38" r="4" fill="#8d8478"/><circle class="smoke" cx="2" cy="-38" r="3.4" fill="#a39a8c"/><circle class="smoke" cx="0" cy="-38" r="3" fill="#6f675d"/></g>`;
function pawn(i){const c=COL[i];
return`<g class="tk" id="tk${i}">
<ellipse class="ring" cx="0" cy="6" rx="22" ry="9" fill="none" stroke="${c}" stroke-width="1.5"/>
<ellipse cx="1" cy="7" rx="13" ry="4.5" fill="rgba(0,0,0,.25)"/>
<g class="bn"><g transform="translate(0,5)">
<ellipse cx="0" cy="-1" rx="12" ry="4.5" fill="${c}" stroke="#22190f" stroke-width="1.7"/>
<path d="M-8.5 -2Q-8 -6 -4.5 -8Q-2.8 -16 -3.6 -20L3.6 -20Q2.8 -16 4.5 -8Q8 -6 8.5 -2Q0 2 -8.5 -2Z" fill="${c}" stroke="#22190f" stroke-width="1.7" stroke-linejoin="round"/>
<circle cx="0" cy="-27" r="8" fill="${c}" stroke="#22190f" stroke-width="1.7"/>${CH}
</g></g></g>`}
function place(){
 if(!S.prev)S.pos.forEach(k=>(S.vst||(S.vst={}))[k]=1);
 const g={};S.pos.forEach((k,i)=>(g[k]=g[k]||[]).push(i));
 S.pos.forEach((k,i)=>{const[x,y]=P[k-1],m=g[k],o=OF[m.length][m.indexOf(i)];$("tk"+i).style.transform=`translate(${x+o[0]}px,${y+o[1]}px)`});
 sync();tileStates();
}
function sync(){
 if($("tnm")&&S.nm[S.t])$("tnm").innerHTML=S.nm[S.t]+stat(S.t);
  S.nm.slice(0,S.n).forEach((_,i)=>{$("tk"+i).classList.toggle("act",i==S.t&&S.win==null);$("tk"+i).classList.toggle("bomb",!!S.burn[i])});
}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const CN=["modrý","červený","zelený","žlutý"];
const stat=p=>{const o=i=>`<svg class="li st" viewBox="0 0 24 24"><use href="#${i}"/></svg>`;return(S.f50[p]?o("i-target"):"")+(S.sav[p]?o("i-shield"):"")+(S.skip[p]?o("i-bomb"):"")};
const face=n=>Array.from({length:9},(_,i)=>`<span class="pp${PIPS[n].includes(i)?" on":""}"></span>`).join("");
function dock(){
  const p=S.t,h=!pc(p)&&!S.busy&&S.win==null;
  $("act").innerHTML=`<div id="turn" style="--pc:${COL[p]}"><span class="av"></span><div class="tt"><b id="tnm">${S.nm[p]}${stat(p)}</b><small id="sub">${S.win!=null?"Konec hry":S.m||""}</small></div><div class="die3${h?" ready":""}" id="die"${h?' role="button" tabindex="0" aria-label="Hodit kostkou"':""}><div class="cube3" id="cube3" style="transform:rotateX(${(FV[S.die]||[0,0])[0]}deg) rotateY(${(FV[S.die]||[0,0])[1]}deg)">${[1,2,3,4,5,6].map(n=>`<div class="die f${n}">${face(n==1&&!S.die?5:n)}</div>`).join("")}</div></div></div>`;
  if(h){$("die").onclick=()=>{if(!S.busy)roll()};$("die").onkeydown=e=>{if((e.key=="Enter"||e.key==" ")&&!S.busy){e.preventDefault();roll()}}}
}
function msg(t){S.m=t;if($("sub"))$("sub").textContent=t}
function turn(){
 const p=S.t;S.busy=0;S.again=null;sync();
 if(S.skip[p]){S.skip[p]=0;S.busy=1;S.die=0;dock();msg(`Vynechává tah (past)`);setTimeout(()=>{S.burn[p]=0;sync();next()},1700);return}
 S.die=0;msg(pc(p)?"Hází kostkou…":`Klepni na kostku (${CN[p]})`);
 if(pc(p)){S.busy=1;dock();setTimeout(roll,1000)}else dock();
}
function toast(t){const e=$("toast");e.textContent=t;e.hidden=0;e.style.animation="none";void e.offsetWidth;e.style.animation="";clearTimeout(e._t);e._t=setTimeout(()=>{e.hidden=1},3200)}
function flipCheck(){
 const ch=[];for(let i=0;i<2;i++)if(S.tc>=S.nf[i]){S.dir[i]*=-1;S.nf[i]=S.tc+S.n*S.fi[i];ch.push(i)}
 if(!ch.length)return;
 drawCells();ch.forEach(i=>{burst(S.tp[2*i],TH.tp.fx);burst(S.tp[2*i+1],TH.tp.fx)});
 toast(ch.length>1?"Obě dvojice spirál změnily směr!":"Jedna dvojice spirál změnila směr!");
}
function next(){S.tc++;flipCheck();S.t=(S.t+1)%S.n;turn()}
const FV={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
async function roll(){
 S.busy=1;dock();msg("Kostka letí…");
 const d=$("die"),c=$("cube3"),v=1+Math.floor(Math.random()*6),sp=()=>360*(2+Math.floor(Math.random()*2));
 c.firstChild.innerHTML=face(1);
 c.style.transition="none";c.style.transform="rotateX(-25deg) rotateY(30deg)";void c.offsetWidth;
 d.classList.add("roll");c.style.transition="transform 1.5s cubic-bezier(.12,.72,.2,1)";
 const[rx,ry]=FV[v];c.style.transform=`rotateX(${rx+sp()}deg) rotateY(${ry+sp()}deg)`;
 await wait(1600);
 S.die=v;d.classList.remove("roll");void d.offsetWidth;d.classList.add("landed");
 msg(`Padlo ${v}`);
 if(navigator.vibrate)navigator.vibrate(20);
 await wait(900);
 const p=S.t,from=S.pos[p],to=Math.min(from+v,FIN);
 S.prev=1;msg(`Figurka jde na pole ${to}…`);
 await stepTo(p,to);await wait(350);
 ask(p,v,from);
}
/* otázka k hozenému poli */
function ask(p,d,from){
 const to=Math.min(from+d,FIN);
 if(!S.deck.length)S.deck=mkDeck();
 const q=S.deck.pop(),idx=sh(q.o.map((_,i)=>i)),multi=Array.isArray(q.c),cor=[].concat(q.c).map(c=>idx.indexOf(c)),sel=[];
 let hid=[];
 if(S.f50[p]&&!multi&&idx.length>2){S.f50[p]=0;hid=sh(idx.map((_,i)=>i).filter(i=>!cor.includes(i))).slice(0,idx.length-2);sync()}
 $("qc").innerHTML=`<div class="bd"><div class="dh"><div class="die">${face(d)}</div><span><b>${S.nm[p]}</b> hodil ${d}. Odpověz správně a figurka na poli ${to} zůstane. Špatně – vrátí se zpět.</span></div><div class="qt"><b>${q.q}</b></div>${hid.length?`<div class="ex">50:50 – dvě špatné odpovědi odpadly.</div>`:""}${multi?`<div class="ex">Vyber 2 správné odpovědi a potvrď.</div>`:""}<div id="ops">${idx.map((x,i)=>`<button class="o" data-i="${i}"${hid.includes(i)?" hidden":""}><i>${"ABCD"[i]}</i><span>${q.o[x]}</span></button>`).join("")}</div><div id="res"></div></div><div class="ft" id="ft">${multi&&!pc(p)?`<button class="big" id="okb">Potvrdit</button>`:""}<button class="big" id="go" disabled style="visibility:hidden">Pokračovat</button></div>`;
 S.act=to;tileStates();tileFx(to,"fx-flip",520);setTimeout(()=>{$("qm").hidden=0},380);
 const B=[...document.querySelectorAll("#ops .o")];
 function fin(s){
  const ok=s.length==cor.length&&s.every(i=>cor.includes(i)),sv=!ok&&S.sav[p]>0;
  if(sv){S.sav[p]=0;sync()}
  const mv=ok||sv;
  B.forEach((b,i)=>{b.disabled=1;if(cor.includes(i))b.classList.add("ok");else if(s.includes(i))b.classList.add("bad")});
  if($("okb"))$("okb").hidden=1;
  const t=ok?`Správně! ${S.nm[p]} zůstává na poli ${to}.`:sv?`Špatná odpověď, ale štít zachránil ${S.nm[p]} – zůstává na poli ${to}.`:`Špatná odpověď – ${S.nm[p]} se vrací zpět na pole ${from}.`;
  if(navigator.vibrate)navigator.vibrate(ok?25:[40,30,40]);
  $("res").innerHTML=`<div class="hd rs ${mv?"rs-ok":"rs-no"}">${t}</div><div class="ex">${q.e}</div>`;
  $("go").style.visibility="visible";$("go").disabled=false;
  $("go").onclick=async()=>{
   $("qm").hidden=1;S.act=0;tileStates();tileFx(to,mv?"fx-ok":"fx-bad",1300);
   if(mv){S.prev=0;place();await arrive(p)}
   else{await wait(350);await stepTo(p,from);S.prev=0;place()}
   if(S.win!=null)return end();
   if(S.again!=null){const a=S.again;S.again=null;S.t=a;turn()}else next();
  };
 }
 if(pc(p))setTimeout(()=>{let s=cor;if(Math.random()>.6)s=[sh(B.map((_,i)=>i).filter(i=>!cor.includes(i)&&!hid.includes(i)))[0]];fin(s)},1800);
 else B.forEach((b,i)=>b.onclick=()=>{
  if(!multi)return fin([i]);
  const j=sel.indexOf(i);j<0?sel.push(i):sel.splice(j,1);b.classList.toggle("sel");
 });
 if($("okb"))$("okb").onclick=()=>fin(sel);
}
/* pohyb figurky po jednom poli */
async function stepTo(p,to){
 await wait(150);
 while(S.pos[p]!=to){S.pos[p]+=Math.sign(to-S.pos[p]);place();await wait(260)}
 await wait(200);
}
function boom(k){const[x,y]=P[k-1],g=document.createElementNS(NS,"g");
 g.setAttribute("class","boom");g.setAttribute("transform",`translate(${x} ${y})`);
 g.innerHTML=`<circle class="b1" r="16" fill="none" stroke="#d98a80" stroke-width="2"/><circle class="b1" r="9" fill="#d98a80" opacity=".5"/>`;
 $("fxl").appendChild(g);if(navigator.vibrate)navigator.vibrate([60,40,90]);setTimeout(()=>g.remove(),1050)}
/* hráč vstoupil na pole – cíl nebo bonus */
async function arrive(p){
 const k=S.pos[p];
 if(k>=FIN){S.win=p;return}
 const ti=S.tp.indexOf(k);
 if(ti>=0){
  const on=(S.dir[ti>>1]==1)==((ti&1)==0),to=S.tp[ti^1],back=to<k,ic=BT.tp[0];
  burst(k,TH.tp.fx);await wait(420);
  const tx=!on?"Tahle spirála je teď jen výstup – nic se nestalo. Směr spirál se po čase mění.":back?`Spirála změnila směr a vrací tě zpět na pole ${to}!`:`Spirála tě přenáší dopředu na pole ${to}!`;
  $("qc").innerHTML=`<div class="bd"><div class="hd">${VI("i-portal")} ${S.nm[p]} ${on?"vstoupil na spirálu!":"stojí na výstupu spirály"}</div><div class="bon"><div class="bi">${ic}</div><h2>${!on?"Výstup":back?"Zpátky!":"Teleport"}</h2><p>${tx}</p></div></div><div class="ft"><button class="big" id="go2">Pokračovat</button></div>`;
  $("qm").hidden=0;if(navigator.vibrate)navigator.vibrate(on&&back?[40,30,40]:25);
  await new Promise(r=>$("go2").onclick=r);
  $("qm").hidden=1;if(on){S.pos[p]=to;place();await wait(600)}return;
 }
 const b=S.bon[k];if(!b)return;
 const rv=!S.vis[k];S.seen[k]=1;drawCells();if(rv)tileFx(k,"fx-flip",520);burst(k,TH[b].fx);await wait(440);
 const[ic,nm,tx]=BT[b];
 $("qc").innerHTML=`<div class="bd"><div class="hd">${VI("i-gift")} ${S.nm[p]} vstoupil na bonusové pole!</div><div class="bon"><div class="bi">${ic}</div><h2>${nm}</h2><p>${tx}</p></div></div><div class="ft"><button class="big" id="go2">Pokračovat</button></div>`;
 $("qm").hidden=0;
 if(navigator.vibrate)navigator.vibrate(b=="past"||b=="zpet"?[40,30,40]:25);
 await new Promise(r=>$("go2").onclick=r);
 $("qm").hidden=1;
 if(b=="tah")S.again=p;
 else if(b=="pul")S.f50[p]=1;
 else if(b=="zach")S.sav[p]=1;
 else if(b=="past"){S.skip[p]=1;S.burn[p]=1;boom(k);sync();await wait(1000)}
 else if(b=="skok"){const t=Math.min(FIN,k+3);await stepTo(p,t);if(t>=FIN)S.win=p}
 else if(b=="zpet")await stepTo(p,Math.max(1,k-3));
 sync();
}
function end(){
 S.busy=1;sync();S.m="";dock();
 const r=[...Array(S.n).keys()].sort((a,b)=>(b==S.win)-(a==S.win)||S.pos[b]-S.pos[a]);
 $("qc").innerHTML=`<div class="bd"><div class="hd" style="font-size:1.3rem">Konec hry</div><p><b>Vítěz: ${S.nm[S.win]} – dorazil na trůn!</b></p>${r.map((p,i)=>`<div class="rw" style="border-color:${COL[p]}">${i+1}. ${S.nm[p]} – pole ${S.pos[p]}/${FIN}</div>`).join("")}</div><div class="ft"><button class="big" onclick="location.reload()">Hrát znovu</button></div>`;
 $("qm").hidden=0;
}
const legend=()=>{
 const r=(i,t)=>`<div class="lr">${i}<span>${t}</span></div>`,E=e=>`<span class="le">${e}</span>`;
 return `<div class="bd"><div class="hd" style="font-size:1.2rem">Legenda</div><div class="lg2">PRAVIDLA</div>${r(E(VI("i-dice")),"Hoď kostkou a odpověz na otázku")}${r(E(VI("i-check")),"Správně – figurka na poli zůstane")}${r(E(VI("i-x")),"Špatně – figurka se vrátí zpět")}${r(E(VI("i-crown")),"Kdo první dorazí do cíle, vyhrává")}`
 +`<div class="lg2">BONUSOVÁ POLE (spustí se, až na ně vstoupíš)</div>${r(`<svg class="li" viewBox="0 0 24 24"><use href="#i-gift"/></svg>`,"Dárek – skryté překvapení")}`
 +Object.values(BT).map(b=>r(E(b[0]),`<b>${b[1]}</b> – ${b[2]}`)).join("")
 +`</div><div class="ft"><button class="big" onclick="$('lg').hidden=1">Zavřít</button><button class="big alt" onclick="if(confirm('Opravdu začít novou hru?'))location.reload()">Nová hra</button></div>`};
/* nápověda: klepnutí na políčko ukáže bublinu s vysvětlením */
var tipT=0;
function hideTip(){clearTimeout(tipT);const t=$("tip");if(t)t.hidden=1;document.querySelectorAll("#cells .tl.sel").forEach(e=>e.classList.remove("sel"))}
function cellInfo(n){
 if(n==1)return[VI("i-flag"),"Start","Odtud všichni vyrážíte."];
 if(n==FIN)return[VI("i-crown"),"Cíl – trůn","Kdo sem první dorazí, vyhrává. Stačí i vyšší hod, než je potřeba."];
 if(S.tp.includes(n)){const ti=S.tp.indexOf(n),on=(S.dir[ti>>1]==1)==((ti&1)==0),o=S.tp[ti^1];return[BT.tp[0],on?"Spirála – vstup":"Spirála – výstup",on?`Přenese tě na pole ${o}${o<n?" – tedy ZPĚT":""}. Směr spirál se po čase mění.`:`Teď jen výstup, nic nedělá. Až se směr otočí, pošle tě na pole ${o}.`]}
 const b=S.bon[n];
 if(!b)return[VI("i-q"),"Obyčejné pole","Nic se tu neděje."];
 if(!(S.seen[n]||S.vis[n]))return[VI("i-gift"),"Dárek","Skryté překvapení, dobré i zlé. Zjistíš ho, až na pole vstoupíš."];
 const x=BT[b];
 return[x[0],x[1],x[2]+(b=="zpet"?" Posune tě jen o 3 pole zpět – na rozdíl od spirály nikam neteleportuje.":"")];
}
function showTip(n){
 const m=$("map"),w=$("mapw"),t=$("tip"),ctm=m.getScreenCTM();if(!ctm)return;
 document.querySelectorAll("#cells .tl.sel").forEach(e=>e.classList.remove("sel"));const te=document.querySelector(`#cells .tl[data-n="${n}"]`);if(te)te.classList.add("sel");
 const[ic,nm,tx]=cellInfo(n),pt=m.createSVGPoint();pt.x=P[n-1][0];pt.y=P[n-1][1];
 const sp=pt.matrixTransform(ctm),rc=w.getBoundingClientRect(),cx=sp.x-rc.left,cy=sp.y-rc.top,rr=22*ctm.a;
 t.innerHTML=`<b>${ic} ${nm}</b>${tx}`;t.classList.remove("dn");t.hidden=0;
 const tw=t.offsetWidth,th=t.offsetHeight,x=Math.max(tw/2+6,Math.min(w.clientWidth-tw/2-6,cx));
 const dn=cy-rr-th-10<6;t.classList.toggle("dn",dn);
 t.style.left=(x-tw/2)+"px";t.style.top=(dn?cy+rr+10:cy-rr-th-10)+"px";
 t.style.setProperty("--ax",(cx-x+tw/2)+"px");
 clearTimeout(tipT);tipT=setTimeout(hideTip,5000);
}
$("map").addEventListener("click",e=>{
 if(!S||!S.n||!P.length)return;
 const m=$("map"),pt=m.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
 const q=pt.matrixTransform(m.getScreenCTM().inverse());
 let best=0,bd=24;P.forEach((p,i)=>{const d=Math.hypot(p[0]-q.x,p[1]-q.y);if(d<bd){bd=d;best=i+1}});
 best?(tileFx(best,"fx-sel",400),showTip(best)):hideTip();
});
S={n:0,pos:[],t:0,win:null,bon:{},vis:{},tp:[],seen:{},nm:[],skip:[],burn:[],f50:[],sav:[]};layout();
if(window.ResizeObserver)new ResizeObserver(()=>layout()).observe($("mapw"));else addEventListener("resize",layout);
$("lgb").onclick=()=>{$("lc").innerHTML=legend();$("lg").hidden=0};
$("lg").onclick=e=>{if(e.target==$("lg"))$("lg").hidden=1};
</script></body></html>
